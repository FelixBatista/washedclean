import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Google test App ID — override via android/gradle.properties (ADMOB_APP_ID) or key.properties.
def admobAppId = "ca-app-pub-3940256099942544~3347511713"
def admobFromGradle = project.findProperty("ADMOB_APP_ID")
if (admobFromGradle != null && !admobFromGradle.toString().trim().isEmpty()) {
    admobAppId = admobFromGradle.toString().trim()
} else if (keystorePropertiesFile.exists()) {
    def k = keystoreProperties.getProperty("ADMOB_APP_ID")
    if (k != null && !k.trim().isEmpty()) {
        admobAppId = k.trim()
    }
}

android {
    namespace "com.washedclean.app"    // REQUIRED on AGP 8+
    compileSdk 36
    
    lintOptions {
        disable 'MissingTranslation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.washedclean.app"
        ndkVersion "26.1.10909125"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        manifestPlaceholders += [admobAppId: admobAppId]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Release / Play builds must use the upload keystore — never debug signing.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Fail fast if someone runs assembleRelease/bundleRelease without key.properties.
gradle.taskGraph.whenReady { graph ->
    def runsRelease = graph.allTasks.any { task ->
        task.project == project &&
                (task.name == "bundleRelease" || task.name == "assembleRelease")
    }
    if (runsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
                "Release builds must be signed with your upload keystore (not debug). " +
                "Create android/key.properties from key.properties.example with storeFile, " +
                "storePassword, keyAlias, and keyPassword."
        )
    }
}

flutter {
    source '../..'
}
